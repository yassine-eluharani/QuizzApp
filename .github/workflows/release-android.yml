name: Release (Android)

# Triggers:
#   • automatic on push to main (production track)
#   • manual on any branch via the Actions tab → "Run workflow" (preview/internal track)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Submit to Google Play after build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: EAS build + submit (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve build profile
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit }}"  >> "$GITHUB_OUTPUT"
          else
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "submit=true"        >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build (Android, non-interactive)
        env:
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.cfg.outputs.profile }} \
            --non-interactive \
            --no-wait=false

      - name: Decode Play service account JSON
        if: steps.cfg.outputs.submit == 'true'
        env:
          PLAY_SA_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$PLAY_SA_BASE64" ]; then
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 secret. Skip submit by setting submit=false." >&2
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$PLAY_SA_BASE64" | base64 --decode > secrets/play-service-account.json
          echo "PLAY_SA_PATH=$(pwd)/secrets/play-service-account.json" >> "$GITHUB_ENV"

      - name: EAS Submit (Android → Google Play internal)
        if: steps.cfg.outputs.submit == 'true'
        run: |
          eas submit \
            --platform android \
            --profile ${{ steps.cfg.outputs.profile }} \
            --latest \
            --non-interactive \
            --key "$PLAY_SA_PATH"

      - name: Cleanup secrets
        if: always()
        run: rm -rf secrets || true
