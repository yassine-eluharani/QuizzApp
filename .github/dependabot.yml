version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-navigation:
        patterns:
          - '@react-navigation/*'
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      types:
        patterns:
          - '@types/*'
      dev-tooling:
        dependency-type: development

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
