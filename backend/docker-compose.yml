# Local-development compose file.
# Copy backend/.env.example to backend/.env and fill in real values before running.
# `docker compose up` will fail loudly if required env vars are missing.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudprep}
      POSTGRES_USER: ${POSTGRES_USER:-cloudprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-cloudprep} -d $${POSTGRES_DB:-cloudprep}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cloudprep:${POSTGRES_PASSWORD}@db:5432/cloudprep}
      REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:?REVENUECAT_SECRET_KEY must be set in .env}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-pro}
      REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

volumes:
  postgres_data:
